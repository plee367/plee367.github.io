<!DOCTYPE html>
<html>
<head>
    <title>Website của tôi</title>
</head>

<body>

    <h1>Chào bạn, tôi là Lê Thế Phát</h1>

    <p>Chào mừng bạn đến với website do chính tôi tạo ra</p>

    <button onclick="hienThi()">Bấm vào đây</button>

    <p id="ketqua"></p>

    <script>
        function hienThi() {
            let noidung = prompt("chan tao đi");

            if (noidung !== null) {
                document.getElementById("ketqua").innerText = noidung;
            }
        }
    </script>

</body>
</html>
