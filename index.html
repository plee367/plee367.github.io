```html
<!DOCTYPE html>
<html>
<head>
    <title>Website của tôi</title>
</head>

<body>

    <h1>Chào bạn, tôi là Lê Thế Phát</h1>

    <p>Chào mừng bạn đến với website do chính tôi tạo ra</p>

    <button onclick="hienThi()">Bấm vào đây</button>

    <div id="khungNhap" style="display: none;">
        <br>
        <input type="text" id="noidung" placeholder="chan tao đi">
        <button onclick="hienThiChu()">Hiện chữ</button>
    </div>

    <p id="ketqua"></p>

    <script>
        function hienThi() {
            document.getElementById("khungNhap").style.display = "block";
        }

        function hienThiChu() {
            let noidung = document.getElementById("noidung").value;
            document.getElementById("ketqua").innerText = noidung;
        }
    </script>

</body>
</html>
