<!DOCTYPE html>
<html>
<head>
    <title>Website của tôi</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        h1 {
            color: darkblue;
        }

        p {
            color: darkgreen;
            font-size: 20px;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #message {
            color: red;
            font-size: 22px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Chào bạn, tôi là Lê Thế Phát</h1>

    <p>Chào mừng bạn đến với website do chính tôi tạo ra</p>

    <button onclick="showMessage()">Bấm vào đây</button>

    <p id="message"></p>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
            "chan bố m đê";
        }
    </script>

</body>
</html>
